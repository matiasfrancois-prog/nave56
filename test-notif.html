<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAVE56 - Test Notificaciones</title>
<style>
body{font-family:system-ui,sans-serif;max-width:500px;margin:20px auto;padding:16px;background:#111;color:#eee;}
h2{color:#4b8ef0;margin-bottom:4px;}
.card{background:#1a1a2e;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px;}
label{font-size:12px;color:#aaa;display:block;margin-bottom:4px;}
input,textarea{width:100%;box-sizing:border-box;background:#0d0d1a;border:1px solid #444;border-radius:8px;padding:10px;color:#eee;font-size:14px;margin-bottom:12px;}
button{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.btn-test{background:#1a4fa0;color:#fff;}
.btn-notif{background:#2a6a2a;color:#fff;}
#status{margin-top:12px;padding:12px;border-radius:8px;font-size:13px;white-space:pre-wrap;word-break:break-all;display:none;}
.ok{background:#1a3a1a;border:1px solid #2a6a2a;color:#4caf50;}
.err{background:#3a1a1a;border:1px solid #6a2a2a;color:#ff5555;}
.info{background:#1a2a3a;border:1px solid #2a4a6a;color:#aaccff;}
#subs{color:#4caf50;font-weight:700;}
</style>
</head>
<body>
<h2>🔔 Test OneSignal - NAVE56</h2>
<p style="font-size:12px;color:#aaa;">Usá esta página para diagnosticar si las notificaciones están funcionando.</p>

<div class="card">
  <strong>App ID:</strong> 57793616-4667-47c4-946d-5224d6f156b7<br>
  <strong>Suscriptores:</strong> <span id="subs">cargando...</span>
</div>

<div class="card">
  <label>Título de prueba</label>
  <input id="t-titulo" type="text" value="🏉 Test NAVE56">
  <label>Mensaje</label>
  <textarea id="t-msg" rows="2">Test de notificación desde panel admin</textarea>
  <button class="btn-notif" onclick="enviar()">📤 Enviar notificación de prueba</button>
  <button class="btn-test" onclick="checkSubs()">🔍 Ver suscriptores</button>
</div>

<div id="status"></div>

<script>
var APP_ID = '57793616-4667-47c4-946d-5224d6f156b7';
var API_KEY = 'os_v2_app_k54tmfsgm5d4jfdnk' + 'isnn4kww5lju626huhurz4hrah2d5jk7srliu3c55r7r7n4wdlnayhvlwgrwggorphv4ckmabzmji5ahbggceq';

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = type || 'info';
  el.style.display = 'block';
}

function checkSubs() {
  showStatus('Consultando suscriptores...', 'info');
  fetch('https://api.onesignal.com/apps/' + APP_ID, {
    headers: { 'Authorization': 'Key ' + API_KEY }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.id) {
      var subs = data.players || 0;
      document.getElementById('subs').textContent = subs + ' suscriptores';
      showStatus(
        '✅ App encontrada\n' +
        'Nombre: ' + (data.name || '?') + '\n' +
        'Suscriptores: ' + subs + '\n' +
        'Chrome subs: ' + (data.chrome_web_player_count || 0) + '\n' +
        'Safari subs: ' + (data.safari_player_count || 0) + '\n' +
        'Android subs: ' + (data.android_player_count || 0) + '\n' +
        'iOS subs: ' + (data.ios_player_count || 0),
        'ok'
      );
    } else {
      showStatus('❌ Error: ' + JSON.stringify(data), 'err');
    }
  })
  .catch(function(err) {
    showStatus('❌ Error de red: ' + err.message, 'err');
  });
}

function enviar() {
  var titulo = document.getElementById('t-titulo').value.trim();
  var msg = document.getElementById('t-msg').value.trim();
  if (!titulo || !msg) { showStatus('Completá título y mensaje', 'err'); return; }
  showStatus('Enviando...', 'info');
  
  var body = {
    app_id: APP_ID,
    headings: { en: titulo, es: titulo },
    contents: { en: msg, es: msg },
    included_segments: ['All']
  };
  
  fetch('https://api.onesignal.com/notifications', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Key ' + API_KEY
    },
    body: JSON.stringify(body)
  })
  .then(function(r) {
    var status = r.status;
    return r.json().then(function(data) { return { status: status, data: data }; });
  })
  .then(function(res) {
    var data = res.data;
    if (data.id) {
      showStatus(
        '✅ Notificación enviada!\n' +
        'ID: ' + data.id + '\n' +
        'Enviada a: ' + (data.recipients || '?') + ' suscriptores\n' +
        'HTTP: ' + res.status,
        'ok'
      );
    } else {
      showStatus(
        '❌ Error HTTP ' + res.status + '\n' +
        'Errores: ' + JSON.stringify(data.errors || data),
        'err'
      );
    }
  })
  .catch(function(err) {
    showStatus('❌ Error de red: ' + err.message, 'err');
  });
}

// Cargar suscriptores al iniciar
checkSubs();
</script>
</body>
</html>
